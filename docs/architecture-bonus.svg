<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" font-family="Arial,Helvetica,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker></defs>
<rect width="900" height="500" fill="#fafafa"/>
<text x="450" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#232f3e">Bonus: Application Load Balancer + Auto Scaling Group (high availability)</text>
<rect x="150" y="42" width="735" height="418" rx="10" fill="#f2f8ff" stroke="#147eb4" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="162" y="62" font-size="12" fill="#147eb4" font-weight="600">VPC (default VPC 172.31.0.0/16) - region us-east-2</text>

<rect x="20" y="180" width="100" height="60" rx="8" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>
<text x="70" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">Internet</text>
<text x="70" y="224" text-anchor="middle" font-size="11" fill="#555">users</text>

<rect x="180" y="165" width="150" height="90" rx="8" fill="#fff0f0" stroke="#d13212" stroke-width="1.6"/>
<text x="255" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">Application LB</text>
<text x="255" y="210" text-anchor="middle" font-size="11" fill="#555">aws-devops-alb, HTTP 80</text>
<text x="255" y="226" text-anchor="middle" font-size="11" fill="#555">SG: 80 from Internet</text>
<text x="255" y="242" text-anchor="middle" font-size="11" fill="#555">spans 2 Availability Zones</text>

<rect x="365" y="180" width="125" height="60" rx="8" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>
<text x="427" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">Target group</text>
<text x="427" y="222" text-anchor="middle" font-size="11" fill="#555">health check GET / 15 s</text>

<rect x="515" y="72" width="360" height="345" rx="10" fill="#fffaf0" stroke="#ec7211" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="527" y="91" font-size="12" fill="#ec7211" font-weight="600">Auto Scaling Group (min 2 / desired 2 / max 3)</text>

<rect x="530" y="102" width="330" height="140" rx="8" fill="#eefaf0" stroke="#3f8624" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="540" y="119" font-size="11" fill="#3f8624" font-weight="600">us-east-2a - public subnet</text>
<rect x="560" y="132" width="270" height="90" rx="8" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>
<text x="695" y="160" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">EC2 web server 1</text>
<text x="695" y="178" text-anchor="middle" font-size="11" fill="#555">Apache via User Data, IMDSv2</text>
<text x="695" y="194" text-anchor="middle" font-size="11" fill="#555">SG: port 80 only from the ALB SG</text>
<text x="695" y="210" text-anchor="middle" font-size="11" fill="#555">IAM instance profile</text>

<rect x="530" y="262" width="330" height="140" rx="8" fill="#eefaf0" stroke="#3f8624" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="540" y="279" font-size="11" fill="#3f8624" font-weight="600">us-east-2b - public subnet</text>
<rect x="560" y="292" width="270" height="90" rx="8" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>
<text x="695" y="320" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">EC2 web server 2</text>
<text x="695" y="338" text-anchor="middle" font-size="11" fill="#555">Apache via User Data, IMDSv2</text>
<text x="695" y="354" text-anchor="middle" font-size="11" fill="#555">SG: port 80 only from the ALB SG</text>
<text x="695" y="370" text-anchor="middle" font-size="11" fill="#555">IAM instance profile</text>

<rect x="350" y="300" width="145" height="70" rx="8" fill="#fff" stroke="#232f3e" stroke-width="1.6"/>
<text x="422" y="326" text-anchor="middle" font-size="14" font-weight="600" fill="#232f3e">Launch template</text>
<text x="422" y="344" text-anchor="middle" font-size="11" fill="#555">aws-devops-lt, AL2023</text>
<text x="422" y="360" text-anchor="middle" font-size="11" fill="#555">t3.micro, user data</text>

<line x1="120" y1="210" x2="180" y2="210" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="150" y="202" text-anchor="middle" font-size="11" fill="#333">80</text>
<line x1="330" y1="210" x2="365" y2="210" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="200" x2="560" y2="175" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="220" x2="560" y2="335" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<text x="405" y="285" font-size="11" fill="#333">forward to targets</text>
<line x1="495" y1="335" x2="515" y2="335" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>

<text x="450" y="440" text-anchor="middle" font-size="11" fill="#d13212">Failure test: instance terminated, ELB health check fails, ASG launches a replacement to restore 2 instances</text>
<text x="450" y="486" text-anchor="middle" font-size="11" fill="#555">Internet gateway + route table connect the public subnets to the Internet; the site stays up on the surviving instance</text>
</svg>
