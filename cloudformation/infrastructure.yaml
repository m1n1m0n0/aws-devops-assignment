AWSTemplateFormatVersion: '2010-09-09'
Description: AWS DevOps Assignment - VPC, subnet, security group, EC2 web server, S3 bucket, IAM role, CloudWatch alarm + SNS.

Parameters:
  Project:
    Type: String
    Default: aws-devops-assignment
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  Owner:
    Type: String
    Description: Your name (used for the Owner tag)
  AdminCidr:
    Type: String
    Description: Your public IP in CIDR form for SSH, e.g. 203.0.113.25/32 (never 0.0.0.0/0)
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: Use a single IP, e.g. 203.0.113.25/32
  AlertEmail:
    Type: String
    Description: Email that receives the CloudWatch alarm notification
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${Project}-vpc'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${Project}-igw'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${Project}-public-subnet'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${Project}-public-rt'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from anywhere, SSH from the administrator IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Public website}
        - {IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: Administration from student IP only}
      Tags:
        - {Key: Name, Value: !Sub '${Project}-web-sg'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete   # assignment cleanup; empty the bucket first (versioned objects too)
    Properties:
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ReadAssetsBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:ListBucket']
                Resource:
                  - !GetAtt AssetsBucket.Arn
                  - !Sub '${AssetsBucket.Arn}/*'
      Tags:
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: {HttpTokens: required}   # enforce IMDSv2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true}
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y httpd
          systemctl enable --now httpd
          echo "<h1>Welcome to AWS DevOps Assignment</h1><p>Deployed by CloudFormation</p>" > /var/www/html/index.html
      Tags:
        - {Key: Name, Value: !Sub '${Project}-web'}
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - {Protocol: email, Endpoint: !Ref AlertEmail}
      Tags:
        - {Key: Owner, Value: !Ref Owner}
        - {Key: Project, Value: !Ref Project}
        - {Key: Environment, Value: !Ref Environment}

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CPU above 70% for 5 minutes
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - {Name: InstanceId, Value: !Ref WebServer}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  WebsiteURL:
    Value: !Sub 'http://${WebServer.PublicIp}'
  InstanceId:
    Value: !Ref WebServer
  BucketName:
    Value: !Ref AssetsBucket
